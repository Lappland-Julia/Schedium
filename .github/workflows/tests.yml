name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CMakeTests / ${{ matrix.os }} / ${{ matrix.build_type }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        build_type: [Debug, Release]
        shared: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4

      - name: Configure library and tests
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DBUILD_TESTING=ON -DSCHEDIUM_BUILD_BENCHMARKS=OFF

      - name: Build CMakeTests
        run: cmake --build build --config ${{ matrix.build_type }} --target CMakeTests --parallel 2

      - name: Require all 48 CMakeTests cases to pass
        run: >-
          ctest --test-dir build -C ${{ matrix.build_type }}
          --tests-regex "^CMakeTests$" --verbose --output-on-failure --no-tests=error
